name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push cancels the first. These jobs build two native toolchains and
# there is no value in finishing a run whose commit is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the domain package's type stripping needs. Below 22.18 the
  # tests fail with a syntax error pointing at a type annotation.
  NODE_VERSION: '22.18'
  DOTNET_VERSION: '9.0.x'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  # ---------------------------------------------------------------------------
  # The gates, and everything that runs without a native toolchain. Fast, and
  # first: if the domain is wrong there is no point building an app around it.
  # ---------------------------------------------------------------------------
  gates:
    name: Gates and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The documentation gate asks git whether a file is tracked, and the
          # journal-freshness warning compares commit times. A shallow clone
          # answers both wrongly.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: make typecheck app-typecheck

      - name: Lint
        run: make lint

      - name: The domain boundary rule still fires
        # Not "the boundary holds" — that is what `lint` checks. This injects a
        # violation and fails if lint stays quiet, because a rule that has
        # silently stopped matching leaves the build green and the guarantee
        # gone.
        run: make boundary

      - name: Documentation
        run: make doc-check

      - name: Parity fixtures are current
        # Fails when a rule changed on the TypeScript side and the fixtures were
        # not regenerated — so it reads as "you forgot a step" rather than "the
        # server is broken".
        run: make fixtures-check

      - name: Domain tests
        run: make test

      - name: App tests
        run: make app-test

      - name: Server tests
        run: make server-test
        env:
          DOTNET: dotnet

  # ---------------------------------------------------------------------------
  # The round trip: the app's own client against the real server. Holds the two
  # wire formats to each other, which the parity fixtures cannot.
  # ---------------------------------------------------------------------------
  round-trip:
    name: App client against the real server
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Start the API
        run: |
          cd server
          dotnet build --nologo
          ASPNETCORE_URLS=http://127.0.0.1:5111 \
            dotnet src/Backhaul.Api/bin/Debug/net9.0/Backhaul.Api.dll > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:5111/healthz > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5111/healthz

      - name: Round trip
        run: |
          # On the in-memory store the server seeds three tokens and prints
          # them; the round trip needs the driver's.
          TOKEN=$(grep -oE '\bdriver\s+[0-9a-f-]+\s+[0-9a-f]{64}' /tmp/api.log | awk '{print $3}' | head -1)
          if [ -z "$TOKEN" ]; then
            echo "no seeded driver token in the server log" >&2
            cat /tmp/api.log >&2
            exit 1
          fi
          BACKHAUL_TOKEN="$TOKEN" node scripts/round-trip.ts

      - name: The server log, if anything failed
        if: failure()
        run: cat /tmp/api.log

  # ---------------------------------------------------------------------------
  # Phase 0's exit gate: both platforms building.
  # ---------------------------------------------------------------------------
  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Assemble
        working-directory: apps/mobile/android
        # `compileSdkVersion` is pinned to 36 rather than React Native's
        # generated 37: build-tools 37 is published and the *platform* is not.
        # See docs/TOOLCHAIN.md.
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS build
    runs-on: macos-15
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pods
        working-directory: apps/mobile/ios
        # Without a UTF-8 locale CocoaPods fails with
        # Encoding::CompatibilityError, and the message does not mention the
        # locale.
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install

      - name: Build for the simulator
        working-directory: apps/mobile/ios
        env:
          LANG: en_US.UTF-8
        run: |
          xcodebuild \
            -workspace BackhaulApp.xcworkspace \
            -scheme BackhaulApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            build
