# Everything needed to run Backhaul's API against a real database.
#
#   docker compose up --build
#   open http://localhost:8080/swagger
#
# Without this, the API runs on an in-memory store and says so on /healthz.
# That is deliberate — see AddBackhaulPersistence — but it is not durable, and
# the ingest path's whole contract is durability.

name: backhaul

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: backhaul
      POSTGRES_PASSWORD: backhaul
      POSTGRES_DB: backhaul
    ports:
      # 55445, not 5432. This machine already runs other projects' databases,
      # and a collision here would point Backhaul's migrations at somebody
      # else's schema.
      - '55445:5432'
    volumes:
      - backhaul-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U backhaul -d backhaul']
      interval: 5s
      timeout: 3s
      retries: 20

  # The SMS gateway we run ourselves.
  #
  # `android-sms-gateway` (Apache-2.0, github.com/capcom6/android-sms-gateway).
  # This container is the *server* half; the half that actually sends is an
  # Android phone running the project's app, paired to this instance, with a
  # Nigerian SIM and a data bundle in it.
  #
  # What that buys: no aggregator account, no per-message billing contract, and
  # codes that arrive from an ordinary Nigerian mobile number — which matters
  # more than it sounds, because an unfamiliar shortcode reads as a scam here.
  #
  # What it does not buy: free SMS. Every message is a message off that SIM's
  # bundle. At a sign-in code per driver per ninety days that is small; at
  # marketing volume it is not, and this is the wrong architecture for that.
  #
  # Commented out rather than running by default: without a paired handset it
  # starts, accepts a message and delivers nothing, which is worse than not
  # being there. Uncomment it, pair a phone, then set Sms__Provider on the api
  # service below.
  #
  # sms:
  #   image: ghcr.io/capcom6/sms-gateway:latest
  #   environment:
  #     GATEWAY__MODE: private
  #   ports:
  #     - '3000:3000'

  api:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Backhaul: >-
        Host=db;Port=5432;Database=backhaul;Username=backhaul;Password=backhaul

      # Uncomment together with the `sms` service above.
      #
      # Until then the API will refuse to start against this database, and it
      # should: the fallback sender writes sign-in codes to the log, where
      # anybody who can read them can sign in as anybody.
      #
      # Sms__Provider: http
      # Sms__Url: http://sms:3000/message
      # Sms__Username: ${SMS_USERNAME}
      # Sms__Password: ${SMS_PASSWORD}
      #
      # The two field names the gateway expects. These are
      # android-sms-gateway's; a different gateway is a config edit rather
      # than a code change.
      # Sms__PhoneField: phoneNumbers
      # Sms__MessageField: message
    ports:
      - '8080:8080'

volumes:
  backhaul-db:
