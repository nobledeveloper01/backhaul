packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 asks about every dependency that wants to run an install script and
# fails the install until each is answered. Answered here rather than by
# `pnpm approve-builds`, so a fresh clone and CI behave the same as this machine.
# React Native's Metro bundler and the iOS and Android build scripts both walk
# node_modules directly rather than going through Node's resolver, and neither
# copes reliably with pnpm's symlinked layout. pnpm 11 reads this here; in
# .npmrc as `node-linker` it is silently ignored.
nodeLinker: hoisted

allowBuilds:
  # Native binding from the toolchain; it has to build to work.
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@react-native/asset-utils@0.87.1'
  - '@react-native/babel-plugin-codegen@0.87.1'
  - '@react-native/babel-preset@0.87.1'
  - '@react-native/codegen@0.87.1'
  - '@react-native/community-cli-plugin@0.87.1'
  - '@react-native/debugger-frontend@0.87.1'
  - '@react-native/debugger-shell@0.87.1'
  - '@react-native/dev-middleware@0.87.1'
  - '@react-native/eslint-config@0.87.1'
  - '@react-native/eslint-plugin@0.87.1'
  - '@react-native/gradle-plugin@0.87.1'
  - '@react-native/jest-preset@0.87.1'
  - '@react-native/js-polyfills@0.87.1'
  - '@react-native/metro-babel-transformer@0.87.1'
  - '@react-native/metro-config@0.87.1'
  - '@react-native/new-app-screen@0.87.1'
  - '@react-native/normalize-colors@0.87.1'
  - '@react-native/typescript-config@0.87.1'
  - '@react-native/virtualized-lists@0.87.1'
  - react-native@0.87.1
